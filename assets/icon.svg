    <circle r="125" fill="#16161e"/>
    <!-- Scanner crosshair -->
    <circle r="48" fill="none" stroke="#ffffff" stroke-width="6"/>
    <line x1="-58" y1="0" x2="58" y2="0" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="-58" x2="0" y2="58" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle r="10" fill="#00d4ff"/>
  </g>
