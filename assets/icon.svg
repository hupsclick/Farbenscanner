<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FarbenScanner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14141a"/>
      <stop offset="100%" stop-color="#0c0c10"/>
    </linearGradient>
    <!-- Full spectrum conic-like via arc segments approximated with linear grads on arcs -->
  </defs>
  <!-- Rounded app background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Spectrum ring: 12 hue segments -->
  <g transform="translate(256,256)">
    <path d="M 0.00 -133.00 L 0.00 -195.00 A 195 195 0 0 1 97.50 -168.87 L 66.50 -115.18 A 133 133 0 0 0 0.00 -133.00 Z" fill="#FF0000"/>
    <path d="M 66.50 -115.18 L 97.50 -168.87 A 195 195 0 0 1 168.87 -97.50 L 115.18 -66.50 A 133 133 0 0 0 66.50 -115.18 Z" fill="#FF8000"/>
    <path d="M 115.18 -66.50 L 168.87 -97.50 A 195 195 0 0 1 195.00 0.00 L 133.00 0.00 A 133 133 0 0 0 115.18 -66.50 Z" fill="#FFD000"/>
    <path d="M 133.00 0.00 L 195.00 0.00 A 195 195 0 0 1 168.87 97.50 L 115.18 66.50 A 133 133 0 0 0 133.00 0.00 Z" fill="#80FF00"/>
    <path d="M 115.18 66.50 L 168.87 97.50 A 195 195 0 0 1 97.50 168.87 L 66.50 115.18 A 133 133 0 0 0 115.18 66.50 Z" fill="#00FF00"/>
    <path d="M 66.50 115.18 L 97.50 168.87 A 195 195 0 0 1 0.00 195.00 L 0.00 133.00 A 133 133 0 0 0 66.50 115.18 Z" fill="#00FF80"/>
    <path d="M 0.00 133.00 L 0.00 195.00 A 195 195 0 0 1 -97.50 168.87 L -66.50 115.18 A 133 133 0 0 0 0.00 133.00 Z" fill="#00FFFF"/>
    <path d="M -66.50 115.18 L -97.50 168.87 A 195 195 0 0 1 -168.87 97.50 L -115.18 66.50 A 133 133 0 0 0 -66.50 115.18 Z" fill="#0080FF"/>
    <path d="M -115.18 66.50 L -168.87 97.50 A 195 195 0 0 1 -195.00 0.00 L -133.00 0.00 A 133 133 0 0 0 -115.18 66.50 Z" fill="#0000FF"/>
    <path d="M -133.00 0.00 L -195.00 0.00 A 195 195 0 0 1 -168.87 -97.50 L -115.18 -66.50 A 133 133 0 0 0 -133.00 0.00 Z" fill="#8000FF"/>
    <path d="M -115.18 -66.50 L -168.87 -97.50 A 195 195 0 0 1 -97.50 -168.87 L -66.50 -115.18 A 133 133 0 0 0 -115.18 -66.50 Z" fill="#FF00FF"/>
    <path d="M -66.50 -115.18 L -97.50 -168.87 A 195 195 0 0 1 -0.00 -195.00 L -0.00 -133.00 A 133 133 0 0 0 -66.50 -115.18 Z" fill="#FF0080"/>
